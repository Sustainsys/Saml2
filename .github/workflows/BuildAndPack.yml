name: BuildAndPack
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: | 
            10.0.x
            9.0.x
            8.0.x

      # Pack the project into a NuGet package with the version derived from the release tag
      - name: dotnet pack
        run: |
          CLEAN_VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          dotnet pack --configuration Release --output ./dist -p:PackageVersion=$CLEAN_VERSION

      # Use the ambient GitHub token to login to NuGet and retrieve an API key
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push the NuGet package to the NuGet repository
      - name: push to NuGet
        run: |
          dotnet nuget push "./dist/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://nuget.org \
            --skip-duplicate